    <script id="wahab-home-featured-bootstrap" data-api-base="%VITE_API_BASE_URL%" data-mode="%MODE%">
      (() => {
        if (window.location.pathname !== '/') return;
        const config = document.getElementById('wahab-home-featured-bootstrap').dataset;
        let base = config.apiBase;
        if (!base || base.startsWith('%')) {
          if (config.mode !== 'development') return;
          base = 'http://localhost:4000/api';
        }
        window.__WAHAB_HOME_FEATURED_PROMISE__ = (async () => {
          let timeout;
          try {
            const controller = new AbortController();
            timeout = setTimeout(() => controller.abort(), 10000);
            const response = await fetch(base.replace(/\/+$/, '') + '/products/featured', {
              credentials: 'include',
              headers: { Accept: 'application/json' },
              signal: controller.signal,
            });
            if (!response.ok) return { ok: false };
            const payload = await response.json();
            const products = payload.data;
            if (!Array.isArray(products) || products.some(product =>
              !product || !Array.isArray(product.images) || product.images.some(image =>
                typeof image !== 'string' || (image && !image.trim())
              )
            )) return { ok: false };
            const image = products[0]?.images.find(Boolean);
            if (image) {
              const preload = document.createElement('link');
              preload.rel = 'preload';
              preload.setAttribute('as', 'image');
              preload.href = image;
              preload.setAttribute('fetchpriority', 'high');
              document.head.appendChild(preload);
            }
            return { ok: true, products };
          } catch {
            return { ok: false };
          } finally {
            clearTimeout(timeout);
          }
        })();
      })();
    </script>
